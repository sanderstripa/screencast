name: Windows build and MP4 verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test audio timeline and suppression
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Exercise H.264 and AAC encoders
        shell: pwsh
        run: |
          $outputDir = Join-Path $PWD 'build/smoke'
          $process = Start-Process build/Release/Screencast.exe -ArgumentList '--self-test', $outputDir -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Encoder self-test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content build/smoke/test-error.txt -ErrorAction SilentlyContinue; throw "Encoder self-test failed: $($process.ExitCode)" }
      - name: Decode and validate the generated recordings
        run: |
          python -m pip install av==16.0.1 numpy==2.2.6
          python tests/verify_mp4.py build/smoke
          python tests/verify_camera.py build/smoke
      - name: Verify optional human matting model on Windows ML
        shell: pwsh
        run: |
          ./scripts/setup-background.ps1 -AppDirectory ./build/Release
          $outputDir = Join-Path $PWD 'build/smoke'
          $process = Start-Process build/Release/Screencast.exe -ArgumentList '--model-test', $outputDir -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Model test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content build/smoke/test-error.txt -ErrorAction SilentlyContinue; throw 'Windows ML model test failed' }
      - name: Capture both UI themes
        shell: pwsh
        run: |
          foreach ($theme in @('light', 'dark')) {
            $imagePath = Join-Path $PWD "build/smoke/theme-$theme.png"
            $process = Start-Process build/Release/Screencast.exe -ArgumentList "--snapshot-$theme", $imagePath -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "UI $theme timed out" }
            if ($process.ExitCode -ne 0 -or -not (Test-Path $imagePath)) { throw "UI $theme failed" }
          }
          $process = Start-Process build/Release/Screencast.exe -ArgumentList '--idle-paint-test', (Join-Path $PWD 'build/smoke') -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(15000) -or $process.ExitCode -ne 0) { throw 'Visible idle repaint regression failed' }
          Get-Content build/smoke/idle-paint.txt
      - name: Package portable app
        # Rendered snapshots are checked separately; a black image is not a passing UI test.
        run: |
          cmake --install build --config Release --prefix dist/Screencast
          Copy-Item scripts dist/Screencast/scripts -Recurse
          Compress-Archive dist/Screencast/* dist/Screencast-Windows-x64.zip
          Get-Item dist/Screencast-Windows-x64.zip | Select-Object Name, Length
      - name: Verify rendered themes
        run: |
          python -m pip install Pillow==11.3.0
          python tests/verify_themes.py build/smoke
      - name: Build native installer
        run: |
          $payload = (Resolve-Path dist/Screencast-Windows-x64.zip).Path.Replace('\', '/')
          cmake -S . -B build -A x64 "-DSCREENCAST_PAYLOAD=$payload"
          cmake --build build --config Release --target ScreencastSetup --parallel
          Copy-Item build/Release/ScreencastSetup.exe dist/Screencast-Setup-x64.exe
          $testDir = Join-Path $PWD 'build/installer-test'
          $process = Start-Process dist/Screencast-Setup-x64.exe -ArgumentList '--install-test', $testDir -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Installer test timed out' }
          if ($process.ExitCode -ne 0 -or (Test-Path "$testDir/Screencast.exe")) { throw 'Installer extraction/uninstall test failed' }
          foreach ($language in @('ru','en')) { foreach ($theme in @('light','dark')) { foreach ($page in 0..3) {
            $image = Join-Path $PWD "build/smoke/setup-$language-$theme-$page.png"
            $process = Start-Process dist/Screencast-Setup-x64.exe -ArgumentList "--snapshot-$language-$theme",$image,$page -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(15000) -or $process.ExitCode -ne 0 -or -not (Test-Path $image)) { throw 'Installer snapshot failed' }
          } } }
          foreach ($theme in @('light','dark')) { foreach ($page in @(1,3)) {
            $image = Join-Path $PWD "build/smoke/setup-ru-$theme-$page-off.png"
            $process = Start-Process dist/Screencast-Setup-x64.exe -ArgumentList "--snapshot-ru-$theme",$image,$page,'off' -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(15000) -or $process.ExitCode -ne 0) { throw 'Unchecked installer snapshot failed' }
          } }
          python tests/verify_installer.py build/smoke
      - uses: actions/upload-artifact@v4
        with:
          name: Screencast-Windows-x64
          path: dist/Screencast-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Screencast-Setup-x64
          path: dist/Screencast-Setup-x64.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-files
          path: build/smoke
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" dist/Screencast-Setup-x64.exe dist/Screencast-Windows-x64.zip --verify-tag --title "Screencast $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
