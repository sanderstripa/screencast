name: Windows build and MP4 verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Configure
        run: |
          ./scripts/import-settings-icon.ps1 -Verify
          ./scripts/import-vpn-icons.ps1 -Verify
          cmake -S . -B build -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test audio timeline and suppression
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Exercise H.264 and AAC encoders
        shell: pwsh
        run: |
          $outputDir = Join-Path $PWD 'build/smoke'
          $process = Start-Process build/Release/Screencast.exe -ArgumentList '--self-test', $outputDir -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Encoder self-test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content build/smoke/test-error.txt -ErrorAction SilentlyContinue; throw "Encoder self-test failed: $($process.ExitCode)" }
      - name: Decode and validate the generated recordings
        run: |
          python -m pip install av==16.0.1 numpy==2.2.6
          python tests/verify_mp4.py build/smoke
          python tests/verify_camera.py build/smoke
      - name: Verify optional human matting model on Windows ML
        shell: pwsh
        run: |
          ./scripts/setup-background.ps1 -AppDirectory ./build/Release
          $outputDir = Join-Path $PWD 'build/smoke'
          $process = Start-Process build/Release/Screencast.exe -ArgumentList '--model-test', $outputDir -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Model test timed out' }
          if ($process.ExitCode -ne 0) { Get-Content build/smoke/test-error.txt -ErrorAction SilentlyContinue; throw 'Windows ML model test failed' }
      - name: Capture both UI themes
        shell: pwsh
        run: |
          foreach ($theme in @('light', 'dark')) {
            $imagePath = Join-Path $PWD "build/smoke/theme-$theme.png"
            $process = Start-Process build/Release/Screencast.exe -ArgumentList "--snapshot-$theme", $imagePath -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "UI $theme timed out" }
            if ($process.ExitCode -ne 0 -or -not (Test-Path $imagePath)) { throw "UI $theme failed" }
            foreach ($variant in @('keyboard-focus','settings','settings-focus','settings-en','en','window-hover','window-hover-start')) {
              $mode = if ($variant -eq 'settings-en') { 'settings' } elseif ($variant -eq 'en') { 'main' } else { $variant }
              $language = if ($variant -in @('settings-en','en')) { 'en' } else { 'ru' }
              $target = Join-Path $PWD "build/smoke/theme-$theme-$variant.png"
              $process = Start-Process build/Release/Screencast.exe -ArgumentList "--snapshot-$theme", $target, $mode, $language -WindowStyle Hidden -PassThru
              if (-not $process.WaitForExit(15000) -or $process.ExitCode -ne 0) { throw "UI $variant failed" }
            }
            $focusPath = Join-Path $PWD "build/smoke/theme-$theme-mouse-focus.png"
            $process = Start-Process build/Release/Screencast.exe -ArgumentList "--snapshot-$theme", $focusPath, 'mouse-focus' -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(15000) -or $process.ExitCode -ne 0) { throw 'Mouse focus rendering failed' }
            $listPath = Join-Path $PWD "build/smoke/theme-$theme-dropdown.png"
            $process = Start-Process build/Release/Screencast.exe -ArgumentList "--snapshot-$theme", $listPath, 'dropdown' -WindowStyle Hidden -PassThru
            if (-not $process.WaitForExit(15000) -or $process.ExitCode -ne 0) { throw 'Dropdown rendering failed' }
          }
          $process = Start-Process build/Release/Screencast.exe -ArgumentList '--dropdown-test', (Join-Path $PWD 'build/smoke') -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(15000)) { $process.Kill(); throw 'Dropdown interaction timed out' }
          if ($process.ExitCode -ne 0) { Get-Content build/smoke/dropdown-error.txt -ErrorAction SilentlyContinue; throw 'Dropdown interaction failed' }
          $process = Start-Process build/Release/Screencast.exe -ArgumentList '--idle-paint-test', (Join-Path $PWD 'build/smoke') -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(15000) -or $process.ExitCode -ne 0) { throw 'Visible idle repaint regression failed' }
          Get-Content build/smoke/idle-paint.txt
          $process = Start-Process build/Release/Screencast.exe -ArgumentList '--ui-test', (Join-Path $PWD 'build/smoke') -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000) -or $process.ExitCode -ne 0) { Get-Content build/smoke/ui-error.txt -ErrorAction SilentlyContinue; throw 'CONNECT UI behavior test failed' }
          Get-Content build/smoke/ui-system.txt
      - name: Package portable app
        # Rendered snapshots are checked separately; a black image is not a passing UI test.
        run: |
          cmake --install build --config Release --prefix dist/Screencast
          Copy-Item scripts dist/Screencast/scripts -Recurse
          Compress-Archive dist/Screencast/* dist/Screencast-Windows-x64.zip
          Get-Item dist/Screencast-Windows-x64.zip | Select-Object Name, Length
      - name: Verify rendered themes
        run: |
          python -m pip install Pillow==11.3.0
          python tests/verify_themes.py build/smoke
      - name: Build shared CONNECT Installer
        run: |
          ./scripts/build-connect-installer.ps1 -PayloadPath "$PWD/dist/Screencast-Windows-x64.zip" -Version '0.4.6' -OutFile "$PWD/dist/Screencast-0.4.6-x64.exe" -TestUI

      - name: Verify app, installer and shell branding
        shell: pwsh
        run: |
          $folder=Join-Path $PWD 'build/smoke/icon-shortcuts'
          New-Item -ItemType Directory -Force $folder | Out-Null
          $shell=New-Object -ComObject WScript.Shell
          $app=Join-Path $PWD 'dist/Screencast/Screencast.exe'
          $icon=Join-Path $PWD 'dist/Screencast/assets/Screencast-shell-0.4.6.ico'
          foreach($name in @('Screencast.lnk','Uninstall.lnk')) {
            $link=$shell.CreateShortcut((Join-Path $folder $name))
            $link.TargetPath=$app;$link.IconLocation="$icon,0";$link.Save()
          }
          ./tests/verify_shell.ps1 -App $app -Setup "$PWD/dist/Screencast-0.4.6-x64.exe" -Shortcuts $folder -IconsOnly

      - uses: actions/upload-artifact@v4
        with:
          name: Screencast-Windows-x64
          path: dist/Screencast-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Screencast-0.4.6-x64
          path: dist/Screencast-0.4.6-x64.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-files
          path: build/smoke
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:RELEASE_TAG" *> $null
          if($LASTEXITCODE -ne 0){
            gh release create "$env:RELEASE_TAG" dist/Screencast-0.4.6-x64.exe dist/Screencast-Windows-x64.zip --verify-tag --title "Screencast $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
            if($LASTEXITCODE){throw 'Release publication failed'}
          }
