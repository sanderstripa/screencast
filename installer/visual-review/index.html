<!doctype html>
<html lang="ru" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screencast — installer visual review 0.3.7</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell"><header><div class="tools"><button id="minimize" aria-label="Свернуть">−</button><button id="close" aria-label="Закрыть">×</button></div></header><main>
