<!doctype html>
<html lang="ru" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONNECT VPN</title><link rel="stylesheet" href="style.css"></head>
<body><div class="shell"><header><div class="tools"><button id="minimize" aria-label="Свернуть">−</button><button id="close" aria-label="Закрыть">×</button></div></header><main>
<section id="welcome" class="welcome"><div class="intro"><p id="eyebrow" class="eyebrow"></p><h1>CONNECT VPN</h1><p id="removeDescription" class="muted" hidden></p><button id="primary" class="primary"></button><button id="settingsButton" class="text-button"></button></div><img class="ribbon" src="assets/mobius.png" alt=""></section>
<section id="settings" hidden><div class="settings-heading"><h2 id="settingsTitle"></h2><button id="back" class="text-button"></button></div><div class="setting-line"><span id="languageLabel"></span><div class="choices"><button id="ru">RU</button><button id="en">EN</button></div><span id="themeLabel"></span><div class="choices"><button id="light"></button><button id="dark"></button></div></div><label id="pathLabel" for="path"></label><div id="pathRow" class="path-line"><input id="path" spellcheck="false"><button id="browse" class="outlined"></button></div><label id="desktopRow" class="switch-row"><input id="desktop" type="checkbox" role="switch" checked><span class="switch"></span><span id="desktopLabel"></span></label><label id="menuRow" class="switch-row"><input id="startMenu" type="checkbox" role="switch" checked><span class="switch"></span><span id="menuLabel"></span></label><label id="chromeRow" class="switch-row"><input id="chrome" type="checkbox" role="switch" checked><span class="switch"></span><span id="chromeLabel"></span></label><p id="extensionHint" class="hint"></p><button id="accept" class="primary"></button></section>
<section id="installing" hidden><img class="progress-ribbon" src="assets/mobius.png" alt=""><div class="progress-bottom"><progress id="progress" max="100" value="0"></progress><p id="status" role="status"></p></div></section>
<section id="finish" hidden><h1>CONNECT VPN</h1><p id="success" role="status"></p><div id="chromeGuide" hidden><p id="chromeNote" class="hint"></p><button id="chromeSetup" class="text-button"></button></div><button id="done" class="primary"></button><label id="launchRow" class="switch-row"><input id="launch" type="checkbox" role="switch" checked><span class="switch"></span><span id="launchLabel"></span></label></section>
<div id="failure" hidden><p id="error" role="alert"></p><button id="retry" class="text-button"></button></div></main><footer><span>by CONNECT.</span><span id="version"></span></footer></div>
<script>window.setupToken="__TOKEN__";window.uninstallMode=__MODE__;window.setupConfig=__CONFIG__;</script><script type="module" src="/wails/runtime.js"></script><script src="setup.js"></script></body></html>
